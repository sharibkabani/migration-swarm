# migration-swarm defaults. Override with `--config my.yaml` (deep-merged over this file).
# Which provider's models to use: claude | gemini | openai. `models` is filled from provider_models
# unless you set `models` yourself in a --config file.
provider: claude
provider_models:
  claude:   # cheap worker, stronger escalation/steward/planner
    worker: anthropic:claude-haiku-5-5
    escalation: anthropic:claude-sonnet-5-5
    steward: anthropic:claude-sonnet-5-5
    planner: anthropic:claude-sonnet-5-5
  gemini:   # GOOGLE_API_KEY or GEMINI_API_KEY. gemini-3.8-flash has a free tier; gemini-4-carbon does not.
    worker: google_genai:gemini-3.8-flash
    escalation: google_genai:gemini-4-carbon
    steward: google_genai:gemini-4-carbon
    planner: google_genai:gemini-4-carbon
  openai:   # OPENAI_API_KEY
    worker: openai:gpt-6-luna
    escalation: openai:gpt-6.2-sol
    steward: openai:gpt-6.2-sol
    planner: openai:gpt-6.2-sol
effort:            # per role: Claude output_config.effort, OpenAI reasoning_effort, Gemini thinking_level
  worker: medium
  escalation: medium
  steward: medium
  planner: low
max_output_tokens: 64000   # per call cap (thinking + the file); streamed. Cut-off replies are paid and wasted
api_max_retries: 8         # SDK retries 429/5xx/connection errors with exponential backoff

# api:  calls the Anthropic API with ANTHROPIC_API_KEY (billed).
# plan: calls go through the Claude Agent SDK signed in with your Claude plan (host login or
#       CLAUDE_CODE_OAUTH_TOKEN). Not billed; draws from the plan's usage limits. Costs and the budget
#       below are API-equivalent (same price table). On a usage limit, calls pause until the window
#       resets, for at most plan.max_wait_s in total; then the run stops as `plan_limit` (resumable).
llm_backend: api
plan:
  max_wait_s: 21600
  poll_s: 900              # wait used when the limit's reset time is unknown

budget_usd: 5.0
per_file_token_cap: 400000 # input+output tokens across all attempts for one unit
concurrency: 8
retries_before_escalation: 2

# USD per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing (read 2026-11-27).
# A tier with `over_prompt_tokens` replaces the base prices for a request whose total prompt
# (input + cache reads + cache writes) exceeds that many tokens.
prices:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
    long_context: {over_prompt_tokens: 100000, input: 0.50, output: 2.50, cache_write_5m: 0.625, cache_write_1h: 1.00, cache_read: 0.05}
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write_5m: 2.50
    cache_write_1h: 4.00
    cache_read: 0.10
  # Gemini, from https://aistudio.google.com/docs/pricing (read 2026-11-27). Prices that the page says
  # rise soon are entered at the higher rate so budgets stay conservative:
  # gemini-4-carbon doubles on 2026-12-01, gemini-3.8-flash doubles on 2027-01-01.
  gemini-4-carbon:
    input: 4.00
    output: 20.00
    cache_read: 0.20
  gemini-3.8-flash:
    input: 1.50
    output: 7.50
    cache_read: 0.15
  # OpenAI, from https://developers.openai.com/api/docs/pricing (read 2026-11-27); long context = >272K input.
  gpt-6.2-sol:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    long_context: {over_prompt_tokens: 272000, input: 4.00, output: 15.00, cache_read: 0.20}
  gpt-6-luna:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    long_context: {over_prompt_tokens: 272000, input: 0.20, output: 0.75, cache_read: 0.02}

# Per-file escape budgets (pack-defined keys; the core only compares counts to these numbers).
escape_budgets:
  explicit_any: 0
  implicit_any: 0
  ts_ignore: 0
  ts_expect_error: 0
  ts_nocheck: 0
  as_unknown_as: 0
  non_null_assertion: 5
  as_cast: 5
  runtime_removed_tokens: 0   # tokens of the original's compiled JS that are missing/altered
  runtime_added_tokens: 40    # e.g. a small narrowing guard
# Budgets lifted (set to unlimited) for the final "degraded" attempt. @ts-ignore/@ts-nocheck never are.
degraded_lifts: [explicit_any, as_cast, non_null_assertion, as_unknown_as]

judge:
  bisect_max_test_runs: 12
  test_timeout_s: 3600

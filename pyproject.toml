[project]
name = "migration-swarm"
version = "0.0.1"
description = "Multi-agent codebase migration engine with an eval harness"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "langgraph>=1.2,<2",
    "langchain>=1.5,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "typer>=0.12",
    "claude-agent-sdk>=0.2.189,<0.3",
]

[project.scripts]
migration-swarm = "migration_swarm.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migration_swarm"]

[tool.pytest.ini_options]
markers = ["docker: needs a local Docker daemon"]
testpaths = ["tests"]

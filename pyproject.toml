[project]
name = "migration-swarm"
version = "0.1.0"
description = "Migrate codebases with a swarm of LLM agents and a deterministic judge (JS -> strict TypeScript first)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["migration", "typescript", "agents", "llm", "langgraph", "codemod"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
    "langgraph>=1.2,<2",
    "langchain>=1.5,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.8,<2",
    "langchain-google-genai>=4.5,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "typer>=0.12",
    "claude-agent-sdk>=0.2.189,<0.3",
    "rich>=14",
    "questionary>=2.1",
]

[project.scripts]
migration-swarm = "migration_swarm.cli:app"
msw = "migration_swarm.cli:app"

[project.urls]
Repository = "https://github.com/sharibkabani/migration-swarm"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migration_swarm"]

[tool.hatch.build.targets.sdist]
include = ["migration_swarm", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
markers = ["docker: needs a local Docker daemon"]
testpaths = ["tests"]
